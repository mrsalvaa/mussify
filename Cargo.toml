[workspace]
resolver = "2"
members = ["crates/engine", "crates/analysis", "src-tauri"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Mussify contributors"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
