[package]
name = "mussify"
description = "Mussify: app libre y offline para aprender música"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "mussify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
mussify-engine = { path = "../crates/engine" }
mussify-analysis = { path = "../crates/analysis" }
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
base64 = "0.22"
log = "0.4"

# Cliente HTTP para las miniaturas de la búsqueda (solo escritorio: en Android no hay búsqueda).
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
